<!doctype html>
<html lang="en">

<head>

    <title>Alghanim - Avatar Demo</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!-- favicon -->
    <link rel="apple-touch-icon" href="assets/image/fav.png">
    <link rel="shortcut icon" type="image/x-icon" href="assets/image/fav-icon.png">
    <!-- Bootstrap CSS v5.2.1 -->
    <link href="assets/css/bootstrap.min.css" rel="stylesheet" />
    <!-- style css -->
    <link rel="stylesheet" type="text/css" href="assets/css/style.css">
    <!-- Azure Speech SDK -->
    <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
</head>

<body>
    <div class="container-fluid">
         <header>
            <nav class="navbar py-4 justify-content-between fixed-lg-top">
                <a class="navbar-brand" href="#">
                    <img src="assets/image/logo.svg" alt="Logo" />
                </a>
            </nav>
        </header>
        <div class="limiter w-100 mx-auto">
            <div class="container-login100">
                <div class="login100-more position-relative" style="background-image: url('assets/image/sara-chat.png');">
                    <a class="login100-more-mic-off" id="micToggle">
                        <video autoplay muted loop playsinline id="bgVideo" class="d-none">
                            <source src="assets/image/video-mic-bg.mp4" type="video/mp4" />
                        </video>
                        <img id="playIcon" src="assets/image/mic-off.svg" alt="icon"/>
                    </a>
                </div>
                <div class="wrap-login100 p-l-50 p-r-50 p-t-72 p-b-50">
                    <ul class="nav nav-tabs border-0 d-none" id="myTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="chat-tab" data-bs-toggle="tab" data-bs-target="#chat"
                                type="button" role="tab" aria-controls="chat" aria-selected="true">chat</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="image-tab" data-bs-toggle="tab" data-bs-target="#image"
                                type="button" role="tab" aria-controls="image" aria-selected="false">image</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="video-tab" data-bs-toggle="tab" data-bs-target="#video"
                                type="button" role="tab" aria-controls="video" aria-selected="false">video</button>
                        </li>
                    </ul>
                    <div class="tab-content" id="myTabContent">
                        <div class="tab-pane fade show active" id="chat" role="tabpanel" aria-labelledby="chat-tab">
                            <div class="chat__card bg-white h-100 d-flex flex-column justify-content-between">
                                <div class="card-header">
                                    <h3 class="mb-0">Transcript</h3>
                                </div>
                                <!---->
                                <div class="card-body flex-grow-1">
                                    <div class="chat__wrapper">

                                        <!--robot-->
                                        <div class="mb-2 d-flex align-items-start gap-2 justify-content-start">
                                            <div
                                                class="chat-bubble chat-robot d-flex justify-content-center align-items-center">
                                                حياك الله انا ساره من شيفروليه الغانم اخبرني كيف يمكنني مساعدتك
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-footer">
                                    <form id="chat__form">
                                        <div
                                            class="input-group p-0 d-flex align-items-center justify-content-between mt-auto">
                                            <input id="text-message" type="text" class="form-control border-0"
                                                placeholder="Typing...">
                                            <button type="submit"
                                                class="btn d-flex align-items-center justify-content-center p-0 border-0">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                                    fill="#fff" class="bi bi-send" viewBox="0 0 16 16">
                                                    <path
                                                        d="M15.964.686a.5.5 0 0 0-.65-.65L.844 6.509a.5.5 0 0 0 .01.934l4.895 1.555 1.555 4.895a.5.5 0 0 0 .934.01l6.473-14.47ZM6.58 8.228 2.593 6.905 13.634 2.3 6.58 8.228Zm.755.754 1.324 3.987 4.634-11.04L7.335 8.982Z" />
                                                </svg>
                                            </button>
                                        </div>

                                    </form>
                                </div>

                            </div>
                        </div>
                        <div class="tab-pane fade" id="image" role="tabpanel" aria-labelledby="image-tab">
                            <div class="image__card bg-white">
                                <div class="card-header">
                                    <h3>Spark EUV - Blue</h3>
                                </div>
                                <div class="card-body p-3">
                                    <img class="img-fluid w-100 h-100" src="assets/image/img.png" alt="image" />
                                </div>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="video" role="tabpanel" aria-labelledby="video-tab">
                            <div class="video__card bg-white">
                                <div class="card-header">
                                    <h3>Spark EUV -  different atmosphere 👾🎮</h3>
                                </div>
                                <div class="card-body p-3">
                                    <div class="video-container">
                                        <video controls autoplay muted loop>
                                            <source src="assets/image/video.mp4" type="video/mp4">
                                            Your browser does not support the video tag.
                                        </video>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JavaScript Libraries -->
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("chat__form");
            const input = document.getElementById("text-message");
            const chatWrapper = document.querySelector(".chat__wrapper");
            const cardBody = document.querySelector(".card-body");

            // Generate a unique user ID for this session
            const userId = 'user_' + Math.random().toString(36).substr(2, 9);

            // Scroll to bottom function
            function scrollToBottom() {
                cardBody.scrollTop = cardBody.scrollHeight;
            }

            scrollToBottom(); // عند تحميل الصفحة

            // Function to add user message to chat
            function addUserMessage(message) {
                const messageDiv = document.createElement("div");
                messageDiv.className = "mb-2 d-flex align-items-start gap-2 justify-content-start";
                const textDiv = document.createElement("div");
                textDiv.className = "chat-bubble chat-human d-flex justify-content-center align-items-center";
                textDiv.textContent = message;
                messageDiv.appendChild(textDiv);
                chatWrapper.appendChild(messageDiv);
                scrollToBottom();
            }

            // Function to add bot message with typing effect
            function addBotMessage(message) {
                const messageDiv = document.createElement("div");
                messageDiv.className = "mb-2 d-flex align-items-start gap-2 justify-content-start";
                const textDiv = document.createElement("div");
                textDiv.className = "chat-bubble chat-robot d-flex justify-content-center align-items-center";
                messageDiv.appendChild(textDiv);
                chatWrapper.appendChild(messageDiv);
                
                // Typing effect
                let index = 0;
                textDiv.textContent = "";
                
                function typeWriter() {
                    if (index < message.length) {
                        textDiv.textContent += message.charAt(index);
                        index++;
                        scrollToBottom();
                        setTimeout(typeWriter, 30); // Adjust speed here
                    }
                }
                
                typeWriter();
                return textDiv;
            }

            // Function to show typing indicator
            function showTypingIndicator() {
                const typingDiv = document.createElement("div");
                typingDiv.className = "mb-2 d-flex align-items-start gap-2 justify-content-start typing-indicator";
                typingDiv.innerHTML = `
                    <div class="chat-bubble chat-robot d-flex justify-content-center align-items-center">
                        <div class="typing-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                `;
                chatWrapper.appendChild(typingDiv);
                scrollToBottom();
                return typingDiv;
            }

            // Function to remove typing indicator
            function removeTypingIndicator() {
                const typingIndicator = document.querySelector('.typing-indicator');
                if (typingIndicator) {
                    typingIndicator.remove();
                }
            }

            // Function to switch tabs based on screen type
            function switchToTab(screenType) {
                // Remove active classes from all tabs and content
                document.querySelectorAll('.nav-link').forEach(tab => tab.classList.remove('active'));
                document.querySelectorAll('.tab-pane').forEach(pane => {
                    pane.classList.remove('show', 'active');
                });

                // Determine which tab to activate
                let targetTab, targetPane;
                switch(screenType) {
                    case 'image':
                        targetTab = document.getElementById('image-tab');
                        targetPane = document.getElementById('image');
                        break;
                    case 'video':
                        targetTab = document.getElementById('video-tab');
                        targetPane = document.getElementById('video');
                        break;
                    case 'default':
                    case 'chat':
                    default:
                        targetTab = document.getElementById('chat-tab');
                        targetPane = document.getElementById('chat');
                        break;
                }

                // Activate the target tab and pane
                if (targetTab && targetPane) {
                    targetTab.classList.add('active');
                    targetPane.classList.add('show', 'active');
                }
            }

            // Function to send message to Dify
            async function sendToDify(message) {
                const typingIndicator = showTypingIndicator();
                
                try {
                    const response = await fetch('/api/dify-chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: message,
                            userId: userId
                        })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to send message to Dify');
                    }

                    removeTypingIndicator();

                    // Handle streaming response
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let botMessageDiv = null;
                    let streamingMessage = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value);
                        const lines = chunk.split('\n');

                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                try {
                                    const data = JSON.parse(line.slice(6));
                                    
                                    if (data.type === 'message') {
                                        // For streaming, we'll collect the message but not display it yet
                                        // We'll wait for the complete message to parse it properly
                                        streamingMessage += data.content;
                                    } else if (data.type === 'message_end') {
                                        console.log('Message completed:', data.full_message);
                                        
                                        // Use the clean answer from the server
                                        const finalMessage = data.full_message || streamingMessage;
                                        const screenType = data.screen || 'default';
                                        
                                        // Add the bot message to chat
                                        addBotMessage(finalMessage);
                                        
                                        // Switch to the appropriate tab based on screen type
                                        switchToTab(screenType);
                                        
                                    } else if (data.type === 'error') {
                                        console.error('Dify error:', data.message);
                                        removeTypingIndicator();
                                        addBotMessage('عذراً، حدث خطأ في معالجة رسالتك. يرجى المحاولة مرة أخرى.');
                                    }
                                } catch (parseError) {
                                    console.error('Error parsing response:', parseError);
                                }
                            }
                        }
                    }
                } catch (error) {
                    console.error('Error sending to Dify:', error);
                    removeTypingIndicator();
                    addBotMessage('عذراً، حدث خطأ في الاتصال. يرجى المحاولة مرة أخرى.');
                }
            }

            form.addEventListener("submit", function (e) {
                e.preventDefault();
                const message = input.value.trim();
                if (message === "") return;

                // Add user message to chat
                addUserMessage(message);
                input.value = "";

                // Send to Dify
                sendToDify(message);
            });

            // Listen for speech recognition events
            document.addEventListener('speechRecognized', function(e) {
                const message = e.detail.message;
                
                // Add user message to chat
                addUserMessage(message);
                
                // Send to Dify
                sendToDify(message);
            });
        });
    </script>
    <script>
  const micToggle = document.getElementById("micToggle");
  const video = document.getElementById("bgVideo");
  const image = document.getElementById("playIcon");
  const textInput = document.getElementById("text-message");

  let recognizer = null;
  let isListening = false;
  let speechToken = null;
  let speechRegion = null;

  // Function to switch back to chat tab
  function switchToChatTab() {
    // Remove active classes from all tabs and content
    document.querySelectorAll('.nav-link').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(pane => {
      pane.classList.remove('show', 'active');
    });

    // Activate chat tab and pane
    const chatTab = document.getElementById('chat-tab');
    const chatPane = document.getElementById('chat');
    
    if (chatTab && chatPane) {
      chatTab.classList.add('active');
      chatPane.classList.add('show', 'active');
    }
  }

  // Get speech token from server
  async function getSpeechToken() {
    try {
      const response = await fetch('/api/speech-token', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        }
      });
      
      if (response.ok) {
        const data = await response.json();
        speechToken = data.token;
        speechRegion = data.region;
        return true;
      } else {
        console.error('Failed to get speech token');
        return false;
      }
    } catch (error) {
      console.error('Error getting speech token:', error);
      return false;
    }
  }

  // Initialize Azure Speech Recognition
  async function initializeSpeechRecognition() {
    if (!speechToken) {
      const tokenReceived = await getSpeechToken();
      if (!tokenReceived) {
        console.error('Cannot initialize speech recognition without token');
        return false;
      }
    }

    const speechConfig = SpeechSDK.SpeechConfig.fromAuthorizationToken(speechToken, speechRegion);
    speechConfig.speechRecognitionLanguage = "ar-SA"; // Arabic (Saudi Arabia)
    
    const audioConfig = SpeechSDK.AudioConfig.fromDefaultMicrophoneInput();
    recognizer = new SpeechSDK.SpeechRecognizer(speechConfig, audioConfig);

    // Event handlers
    recognizer.recognizing = function (s, e) {
      console.log("Recognizing: " + e.result.text);
      textInput.value = e.result.text;
      
      // Switch back to chat tab when user starts speaking
      switchToChatTab();
    };

    recognizer.recognized = function (s, e) {
      if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech) {
        console.log("Recognized: " + e.result.text);
        textInput.value = e.result.text;
        
        // Auto-submit the message to chat and send to Dify
        if (e.result.text.trim() !== "") {
          // Get the sendToDify function from the main script
          const event = new CustomEvent('speechRecognized', { 
            detail: { message: e.result.text.trim() } 
          });
          document.dispatchEvent(event);
          
          // Clear the input
          textInput.value = "";
          
          // Keep listening - don't stop the microphone
        }
      }
    };

    recognizer.canceled = function (s, e) {
      console.log("Recognition canceled: " + e.reason);
      if (e.reason === SpeechSDK.CancellationReason.Error) {
        console.log("Error details: " + e.errorDetails);
      }
      stopListening();
    };

    recognizer.sessionStopped = function (s, e) {
      console.log("Session stopped");
      stopListening();
    };

    return true;
  }

  async function startListening() {
    try {
      if (!recognizer) {
        const initialized = await initializeSpeechRecognition();
        if (!initialized) {
          console.error('Failed to initialize speech recognition');
          return;
        }
      }
      
      isListening = true;
      recognizer.startContinuousRecognitionAsync(
        function() {
          console.log("Speech recognition started");
        },
        function(err) {
          console.error("Error starting recognition: " + err);
          stopListening();
        }
      );
      
      // Update UI - When listening, show video (mic on)
      video.classList.remove("d-none");
      image.classList.add("d-none");
      textInput.placeholder = "Listening...";
    } catch (error) {
      console.error('Error in startListening:', error);
      stopListening();
    }
  }

  function stopListening() {
    if (recognizer && isListening) {
      recognizer.stopContinuousRecognitionAsync(
        function() {
          console.log("Speech recognition stopped");
        },
        function(err) {
          console.error("Error stopping recognition: " + err);
        }
      );
    }
    
    isListening = false;
    
    // Update UI - When not listening, show mic-off icon
    video.classList.add("d-none");
    image.classList.remove("d-none");
    textInput.placeholder = "Typing...";
  }

  micToggle.addEventListener("click", function (e) {
    e.preventDefault();

    if (isListening) {
      stopListening();
    } else {
      startListening();
    }
  });

  // Initialize on page load
  document.addEventListener("DOMContentLoaded", function() {
    // Get initial token
    getSpeechToken();
  });
</script>
</body>

</html>
